<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#F0F8FF"/>

  <!-- Book page -->
  <rect x="20" y="20" width="160" height="160" fill="#FFFACD" stroke="#DAA520" stroke-width="2" rx="5"/>

  <!-- Heading text -->
  <text x="100" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">My Story</text>

  <!-- Large blue star -->
  <polygon points="100,40 110,70 142,70 118,90 128,120 100,100 72,120 82,90 58,70 90,70"
           fill="#0066FF" stroke="#0033CC" stroke-width="2"/>

  <!-- Text indicating where star goes -->
  <text x="100" y="150" font-size="12" text-anchor="middle" fill="#666">Blue Star</text>

  <!-- Arrow pointing to star -->
  <line x1="100" y1="160" x2="100" y2="130" stroke="#FF6347" stroke-width="2"/>
  <polygon points="100,130 95,140 105,140" fill="#FF6347"/>
</svg>