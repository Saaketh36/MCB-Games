<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#E8F5E9"/>

  <!-- Book closed on desk -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="100" height="120" rx="5" fill="#FFE5B4" stroke="#8B4513" stroke-width="2"/>
    <text x="50" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">My Adventure</text>
    <text x="50" y="80" font-size="12" text-anchor="middle" fill="#666">Story</text>
  </g>

  <!-- Bell ringing -->
  <g transform="translate(200, 100)">
    <!-- Bell body -->
    <path d="M 0 10 Q -15 10 -15 25 Q -15 40 0 45 Q 15 40 15 25 Q 15 10 0 10" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <!-- Bell clapper -->
    <circle cx="0" cy="35" r="4" fill="#333"/>
    <!-- Bell handle -->
    <rect x="-3" y="0" width="6" height="10" fill="#DAA520" stroke="#8B4513" stroke-width="1"/>
    <!-- Motion lines (ringing) -->
    <path d="M -25 20 L -35 15" stroke="#FF6347" stroke-width="2" stroke-linecap="round"/>
    <path d="M 25 20 L 35 15" stroke="#FF6347" stroke-width="2" stroke-linecap="round"/>
    <path d="M -30 35 L -40 35" stroke="#FF6347" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 35 L 40 35" stroke="#FF6347" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Student sitting quietly -->
  <g transform="translate(50, 200)">
    <!-- Head -->
    <circle cx="15" cy="10" r="10" fill="#FDB4B4"/>
    <!-- Body -->
    <rect x="8" y="20" width="14" height="25" fill="#FF6B9D"/>
    <!-- Arms at rest -->
    <line x1="0" y1="25" x2="8" y2="30" stroke="#FDB4B4" stroke-width="3"/>
    <line x1="30" y1="25" x2="22" y2="30" stroke="#FDB4B4" stroke-width="3"/>
  </g>

  <!-- Label -->
  <text x="150" y="280" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Book closed, bell rings!</text>
</svg>