<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="250" fill="#E8F5E9"/>

  <!-- Book page background -->
  <rect x="30" y="30" width="240" height="190" fill="#FFFACD" stroke="#DAA520" stroke-width="2" rx="5"/>

  <!-- Title -->
  <text x="150" y="60" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Which picture must you circle?</text>

  <!-- Red bus with circle around it -->
  <g transform="translate(100, 130)">
    <!-- Circle (marker) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FF0000" stroke-width="4" stroke-dasharray="5,5"/>

    <!-- Bus body -->
    <rect x="-30" y="-15" width="60" height="32" rx="3" fill="#FF0000" stroke="#000" stroke-width="2"/>
    <!-- Bus front -->
    <rect x="-30" y="-20" width="15" height="5" fill="#FFD700"/>
    <!-- Bumper -->
    <rect x="13" y="-18" width="4" height="36" fill="#000"/>

    <!-- Windows -->
    <rect x="-26" y="-12" width="11" height="10" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <rect x="-10" y="-12" width="11" height="10" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <rect x="6" y="-12" width="11" height="10" fill="#87CEEB" stroke="#000" stroke-width="1"/>

    <!-- Wheels -->
    <circle cx="-15" cy="18" r="6" fill="#333" stroke="#000" stroke-width="1"/>
    <circle cx="15" cy="18" r="6" fill="#333" stroke="#000" stroke-width="1"/>
    <!-- Wheel centers -->
    <circle cx="-15" cy="18" r="2" fill="#666"/>
    <circle cx="15" cy="18" r="2" fill="#666"/>
  </g>

  <!-- Label -->
  <text x="150" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#FF0000">Red Bus</text>
</svg>