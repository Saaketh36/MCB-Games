<svg viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="350" fill="#F5F5F5"/>

  <!-- Title -->
  <text x="150" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Lab Coat Protection</text>

  <!-- Student without coat (splashed) -->
  <g transform="translate(50, 70)">
    <!-- Head -->
    <circle cx="30" cy="15" r="12" fill="#FDB4B4"/>
    <!-- Body (school clothes) -->
    <rect x="20" y="28" width="20" height="35" fill="#FF6B9D"/>
    <!-- Chemical splashes on clothes -->
    <circle cx="22" cy="40" r="4" fill="#228B22" opacity="0.7"/>
    <circle cx="33" cy="48" r="3" fill="#228B22" opacity="0.7"/>
    <circle cx="27" cy="58" r="5" fill="#228B22" opacity="0.7"/>
    <!-- Sad face -->
    <circle cx="26" cy="12" r="3" fill="#000"/>
    <circle cx="34" cy="12" r="3" fill="#000"/>
    <path d="M 26 18 Q 30 17 34 18" stroke="#000" stroke-width="1" fill="none"/>
    <!-- Label -->
    <text x="30" y="80" font-size="11" text-anchor="middle" fill="#FF0000" font-weight="bold">NOT SAFE</text>
  </g>

  <!-- Arrow -->
  <text x="150" y="130" font-size="28" text-anchor="middle" fill="#4CAF50">→</text>

  <!-- Student with coat (protected) -->
  <g transform="translate(200, 70)">
    <!-- Head -->
    <circle cx="30" cy="15" r="12" fill="#FDB4B4"/>
    <!-- Lab coat (white) -->
    <path d="M 15 28 L 10 28 L 12 50 Q 15 60 30 60 Q 45 60 48 50 L 50 28 L 45 28 L 43 58 Q 43 63 30 63 Q 17 63 17 58 Z"
          fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <!-- Coat buttons -->
    <circle cx="30" cy="38" r="1.5" fill="#333"/>
    <circle cx="30" cy="46" r="1.5" fill="#333"/>
    <!-- School clothes visible but protected inside -->
    <rect x="22" y="35" width="16" height="20" fill="#FF6B9D" opacity="0.3"/>
    <!-- Splashes bouncing off -->
    <circle cx="8" cy="40" r="3" fill="#228B22" opacity="0.3"/>
    <circle cx="52" cy="45" r="4" fill="#228B22" opacity="0.3"/>
    <!-- Happy face -->
    <circle cx="26" cy="12" r="3" fill="#000"/>
    <circle cx="34" cy="12" r="3" fill="#000"/>
    <path d="M 26 18 Q 30 19 34 18" stroke="#000" stroke-width="1" fill="none"/>
    <!-- Label -->
    <text x="30" y="80" font-size="11" text-anchor="middle" fill="#4CAF50" font-weight="bold">SAFE!</text>
  </g>

  <!-- Bottom box with info -->
  <rect x="20" y="180" width="260" height="160" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="8"/>

  <!-- Lab coat info -->
  <text x="150" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Lab Coat Benefits:</text>

  <text x="35" y="230" font-size="12" fill="#333">✓ Protects clothing from chemicals</text>
  <text x="35" y="250" font-size="12" fill="#333">✓ Prevents skin splashes</text>
  <text x="35" y="270" font-size="12" fill="#333">✓ Easy to remove if accident</text>
  <text x="35" y="290" font-size="12" fill="#333">✓ Keeps school clothes clean</text>
  <text x="35" y="310" font-size="12" fill="#333">✓ Professional lab appearance</text>
</svg>