<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Play Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        header { text-align: center; margin-bottom: 40px; }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { color: #1f4f94; font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; }

        .student-info { background: #f4f6ff; border-left: 4px solid #667eea; padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .info-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 12px; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { font-size: 12px; color: #667eea; font-weight: 700; text-transform: uppercase; }
        .info-value { font-size: 16px; color: #333; font-weight: 600; }

        .pin-section { background: #fff3cd; border: 2px solid #ffc107; border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: center; }
        .pin-label { font-size: 12px; color: #856404; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .pin-code { font-size: 32px; font-weight: 700; color: #ff6b35; letter-spacing: 4px; font-family: 'Courier New', monospace; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
        .divider-line { flex: 1; height: 1px; background: #e5e7eb; }
        .divider-text { color: #999; font-size: 12px; font-weight: 600; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); }
        .btn-secondary { background: #10b981; color: white; }
        .btn-secondary:hover { background: #059669; transform: translateY(-2px); }

        .game-card { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; }
        .game-name { font-size: 18px; font-weight: 700; color: #1f4f94; margin-bottom: 8px; }
        .game-type { display: inline-block; background: #e0e5ff; color: #1f4f94; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
        .game-details { color: #666; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

        .message { padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .input-field { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: 'Poppins', sans-serif; margin-bottom: 16px; }
        .input-field:focus { outline: none; border-color: #667eea; }
        .input-field:disabled { background: #f5f5f5; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <header>
            <div class="logo">🎮</div>
            <h1>Student Dashboard</h1>
            <p class="subtitle">Play games and earn points</p>
        </header>

        <div id="messageBox"></div>

        <!-- Student Info -->
        <div class="student-info">
            <div class="info-row">
                <div>
                    <div class="info-label">Student Name</div>
                    <div class="info-value" id="studentName">-</div>
                </div>
                <div>
                    <div class="info-label">Roll Number</div>
                    <div class="info-value" id="studentRoll">-</div>
                </div>
            </div>
            <div class="info-row">
                <div>
                    <div class="info-label">Class</div>
                    <div class="info-value" id="studentClass">-</div>
                </div>
                <div>
                    <div class="info-label">Subject</div>
                    <div class="info-value" id="studentSubject">-</div>
                </div>
            </div>
        </div>

        <!-- PIN Section -->
        <div class="pin-section">
            <label class="pin-label">Your Game PIN</label>
            <input type="text" id="pinInput" class="input-field" placeholder="Enter or auto-filled PIN" maxlength="6" style="text-align: center; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;" onkeypress="if(event.key==='Enter') playWithPin()">
        </div>

        <button class="btn btn-primary" onclick="playWithPin()">🎯 Play This Game</button>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">OR</div>
            <div class="divider-line"></div>
        </div>

        <button class="btn btn-secondary" onclick="playAutomatic()">⚡ Play Available Game</button>

        <!-- Game Display Area -->
        <div id="gameDisplay"></div>
    </div>
</div>

<script src="curriculum-data.js"></script>
<script>
const API = (location.port === '5000' ? '' : 'http://127.0.0.1:5000') + '/api';
let currentGame = null;

// Get URL parameters
const urlParams = new URLSearchParams(window.location.search);
const studentNameParam = urlParams.get('name');
const studentRollParam = urlParams.get('roll');
const studentClassParam = urlParams.get('class');
const studentSubjectParam = urlParams.get('subject');
const pinParam = urlParams.get('pin');

function showMessage(text, type = 'info') {
    const box = document.getElementById('messageBox');
    box.innerHTML = `<div class="message ${type}">${text}</div>`;
}

// Set student info from URL or localStorage
function loadStudentInfo() {
    let name = studentNameParam || localStorage.getItem('studentName') || '';
    let roll = studentRollParam || localStorage.getItem('studentRoll') || '';
    let classVal = studentClassParam || localStorage.getItem('studentClass') || '';
    let subject = studentSubjectParam || localStorage.getItem('studentSubject') || '';
    let pin = pinParam || localStorage.getItem('studentPin') || '';

    if (name) document.getElementById('studentName').textContent = name;
    if (roll) document.getElementById('studentRoll').textContent = roll;
    if (classVal) document.getElementById('studentClass').textContent = 'Class ' + classVal;
    if (subject) document.getElementById('studentSubject').textContent = subject;
    if (pin) document.getElementById('pinInput').value = pin;

    // Save to localStorage
    if (name) localStorage.setItem('studentName', name);
    if (roll) localStorage.setItem('studentRoll', roll);
    if (classVal) localStorage.setItem('studentClass', classVal);
    if (subject) localStorage.setItem('studentSubject', subject);
    if (pin) localStorage.setItem('studentPin', pin);
}

async function playWithPin() {
    const pin = document.getElementById('pinInput').value.trim().toUpperCase();
    if (!pin) {
        showMessage('❌ Please enter or scan PIN', 'error');
        return;
    }

    showMessage(`🔍 Looking up PIN: ${pin}...`, 'info');

    try {
        const res = await fetch(API + '/portal/get-game-by-pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
        });
        const body = await res.json();

        if (res.ok && body.game) {
            displayGame(body.game);
            showMessage(`✅ Game found! Start playing below.`, 'success');
        } else {
            showMessage('❌ Invalid PIN. Please check and try again.', 'error');
        }
    } catch (e) {
        showMessage('❌ Server error: ' + e.message, 'error');
    }
}

async function playAutomatic() {
    showMessage(`⏳ Finding a game for you...`, 'info');

    try {
        const res = await fetch(API + '/portal/get-random-game', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        });
        const body = await res.json();

        if (res.ok && body.game) {
            displayGame(body.game);
            showMessage(`✅ Game assigned! Start playing below.`, 'success');
        } else {
            showMessage('❌ No games available. Ask your teacher for a PIN.', 'error');
        }
    } catch (e) {
        showMessage('❌ Server error: ' + e.message, 'error');
    }
}

function displayGame(game) {
    currentGame = game;
    console.log('Game loaded:', game);

    const gameType = game.type || 'Game';
    const gameClass = game.class || 'N/A';
    const gameSubject = game.subject || 'N/A';
    const gameSkill = game.skill || 'N/A';
    const gameSubskill = game.subskill || 'N/A';

    const html = `
        <div class="game-card">
            <div class="game-name">${game.name}</div>
            <div class="game-type">${gameType}</div>
            <div class="game-details">
                📚 Class: ${gameClass} | ${gameSubject}<br>
                🎯 Skill: ${gameSkill} – ${gameSubskill}
            </div>
            <button class="btn btn-primary" onclick="startGame('${game.id}', '${game.name}')">▶ START PLAYING</button>
        </div>
    `;
    document.getElementById('gameDisplay').innerHTML = html;
}

function startGame(gameId, gameName) {
    console.log('Starting game:', gameId, gameName);

    const studentName = document.getElementById('studentName').textContent || 'Student';
    const studentRoll = document.getElementById('studentRoll').textContent || 'N/A';

    if (!gameId) {
        alert('❌ Error: Game ID not found');
        return;
    }

    // Redirect to play.html with game ID and student info
    const gameUrl = `play.html?id=${encodeURIComponent(gameId)}&studentName=${encodeURIComponent(studentName)}&studentRoll=${encodeURIComponent(studentRoll)}`;
    console.log('Redirecting to:', gameUrl);
    window.location.href = gameUrl;
}

// Load student info on page load
loadStudentInfo();
showMessage('👋 Welcome! Enter your PIN to play a game, or play an available game.', 'info');
</script>

</body>
</html>
