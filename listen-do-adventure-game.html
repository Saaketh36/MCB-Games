<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen & Do Adventure - MyClassboard Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .info-box { background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .info-box strong { color: #1976d2; }
        .game-section { margin: 30px 0; }
        .section-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 15px; }
        .instruction { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #ffc107; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .item { padding: 20px; border: 3px solid #e0e0e0; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: #f9f9f9; }
        .item:hover { border-color: #667eea; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2); transform: translateY(-3px); }
        .item.selected { background: #667eea; color: white; border-color: #667eea; }
        .item-emoji { font-size: 40px; margin-bottom: 10px; }
        .item-label { font-weight: 600; font-size: 14px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .status { text-align: center; padding: 15px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .score-display { background: #d4edda; color: #155724; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; border: 2px solid #28a745; }
        .score-display h3 { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎧 Listen & Do Adventure</h1>
        <p class="subtitle">Sequence Order Game</p>
    </header>

    <div class="info-box">
        <strong>📚 Activity:</strong> Listen & Do Adventure<br>
        <strong>📖 Type:</strong> Sequence Order<br>
        <strong>🎯 Skill:</strong> Following Instructions
    </div>

    <div class="game-section">
        <h2 class="section-title">Instructions</h2>
        <div class="instruction">
            <strong>🎯 Your Task:</strong><br>
            Click the items in the correct order from the sequence!
        </div>
    </div>

    <div class="game-section">
        <h2 class="section-title">Arrange in Order</h2>
        <div class="items-grid" id="itemsGrid">
            <div class="item" onclick="selectItem(this, 'brush')">
                <div class="item-emoji">🪥</div>
                <div class="item-label">Brush Teeth</div>
            </div>
            <div class="item" onclick="selectItem(this, 'eat')">
                <div class="item-emoji">🥣</div>
                <div class="item-label">Eat</div>
            </div>
            <div class="item" onclick="selectItem(this, 'dress')">
                <div class="item-emoji">👕</div>
                <div class="item-label">Dress</div>
            </div>
            <div class="item" onclick="selectItem(this, 'school')">
                <div class="item-emoji">🏫</div>
                <div class="item-label">School</div>
            </div>
            <div class="item" onclick="selectItem(this, 'play')">
                <div class="item-emoji">🎮</div>
                <div class="item-label">Play</div>
            </div>
        </div>
    </div>

    <div id="status"></div>
    <button onclick="checkAnswer()">✓ Check Answer</button>
    <div id="scoreDisplay"></div>
</div>

<script>
let selectedSequence = [];
const correctSequence = ['brush', 'eat', 'dress', 'school', 'play'];
let score = 0;

function selectItem(element, value) {
    if (element.classList.contains('selected')) {
        element.classList.remove('selected');
        selectedSequence = selectedSequence.filter(v => v !== value);
    } else {
        element.classList.add('selected');
        selectedSequence.push(value);
    }
}

function checkAnswer() {
    const statusEl = document.getElementById('status');
    if (selectedSequence.length === 0) {
        statusEl.className = 'status error';
        statusEl.textContent = '❌ Please select all items!';
        return;
    }
    let isCorrect = true;
    for (let i = 0; i < correctSequence.length; i++) {
        if (selectedSequence[i] !== correctSequence[i]) {
            isCorrect = false;
            break;
        }
    }
    if (isCorrect) {
        score = 100;
        statusEl.className = 'status success';
        statusEl.textContent = '✅ Perfect! You got it right!';
        document.getElementById('scoreDisplay').innerHTML = '<div class="score-display"><h3>🎉 Score: 100/100</h3></div>';
    } else {
        statusEl.className = 'status error';
        statusEl.textContent = '❌ Not quite right. Try again!';
    }
}
</script>

</body>
</html>
