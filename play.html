<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play – MyClassboard Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/class2_games.css">
<style>
:root{--p:#667eea;--p2:#764ba2;--ok:#28a745;--bad:#dc3545;--ink:#2d3250;--bg:#f4f6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',system-ui,sans-serif;background:linear-gradient(135deg,var(--p),var(--p2));min-height:100vh;padding:16px;color:var(--ink)}
.card{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;line-height:1.2}
.crumbs{font-size:12px;color:#777;margin-top:4px}
.badge{background:var(--bg);color:var(--p);font-weight:600;font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pts{background:#fff7d6;color:#8a6a00;font-weight:700;padding:6px 12px;border-radius:20px;font-size:14px}
.bar{height:8px;background:#e8ebfa;border-radius:8px;overflow:hidden;margin:10px 0 18px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .3s}
.intro{background:#eef1ff;border-left:4px solid var(--p);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}
.qtext{font-size:20px;font-weight:600;margin-bottom:14px;line-height:1.35}
.options{display:grid;gap:10px}
button{font-family:inherit;cursor:pointer}
.opt{background:#fff;border:2px solid #dfe3f5;border-radius:12px;padding:12px 14px;font-size:16px;text-align:left;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--p);background:#f6f7ff}
.opt.right{background:#d9f5e0;border-color:var(--ok)}
.opt.wrong{background:#fde0e3;border-color:var(--bad);animation:shake .35s}
.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:600;margin-top:16px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.quit{background:#fff;color:#c0392b;border:2px solid #e6b0aa;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600}
.quit:hover{background:#fdf0ee}
.ghost{background:#fff;color:var(--p);border:2px solid var(--p);border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;margin:16px 8px 0 0}
.explain{margin-top:12px;background:#fffbea;border-left:4px solid #f0b400;padding:10px 12px;border-radius:8px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{background:#fff;border:2px solid #dfe3f5;border-radius:10px;padding:10px 14px;font-size:16px;user-select:none}
.chip:hover:not(:disabled){border-color:var(--p)}
.chip.sel{background:var(--p);color:#fff;border-color:var(--p)}
.chip.used{opacity:.3;pointer-events:none}
.chip.done{background:#d9f5e0;border-color:var(--ok);pointer-events:none}
.chip.bad{background:#fde0e3;border-color:var(--bad);animation:shake .35s}
.slots{display:grid;gap:8px;margin:10px 0}
.slot{display:flex;align-items:center;gap:10px;min-height:46px;border:2px dashed #c9cff0;border-radius:10px;padding:6px 10px;background:#fafbff}
.slot b{background:var(--p);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.slot.ok{border-color:var(--ok);background:#effaf1}.slot.no{border-color:var(--bad);background:#fff1f2}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols h3{font-size:13px;color:#777;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.cols .chip{display:block;width:100%;margin-bottom:8px;text-align:left}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.cat{border:2px solid #c9cff0;border-radius:12px;padding:10px;min-height:110px;cursor:pointer;background:#fafbff}
.cat:hover{border-color:var(--p)}.cat h4{font-size:15px;margin-bottom:8px;color:var(--p)}
.cat .chip{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.mem{height:84px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:15px;font-weight:600;padding:6px}
.mem.open{background:#fff;color:var(--ink);border:2px solid var(--p)}.mem.done{background:#d9f5e0;color:var(--ink);border:2px solid var(--ok);pointer-events:none}
input[type=text]{width:100%;padding:12px 14px;border:2px solid #dfe3f5;border-radius:12px;font-size:18px;font-family:inherit;margin-top:6px}
input[type=text]:focus{outline:none;border-color:var(--p)}
textarea{width:100%;padding:12px;border:2px solid #dfe3f5;border-radius:12px;font-family:inherit;font-size:16px;margin-top:10px;min-height:70px}
.word{font-size:30px;letter-spacing:6px;font-weight:700;text-align:center;margin:14px 0;min-height:44px}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.key{width:38px;height:42px;border:2px solid #dfe3f5;border-radius:8px;background:#fff;font-weight:600;font-size:16px}
.key.hit{background:#d9f5e0;border-color:var(--ok)}.key.miss{background:#fde0e3;border-color:var(--bad)}.key:disabled{cursor:default}
.story{background:#fffbea;border-radius:12px;padding:16px;font-size:18px;line-height:1.6;margin-top:14px}
.timer{font-weight:700;color:var(--bad);font-size:18px}
.res{text-align:center;padding:10px 0}.res .stars{font-size:44px}.res .big{font-size:34px;font-weight:700;margin:8px 0}
.msg{padding:30px 10px;text-align:center}.msg p{margin:8px 0;color:#555}
.fb{margin-top:10px;font-weight:600;min-height:24px}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:560px){.cols{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div>
      <h1 id="title">Loading…</h1>
      <div class="crumbs" id="crumbs"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="badge" id="typeBadge"></span>
      <span class="pts">⭐ <span id="pts">0</span></span>
      <button type="button" class="quit" onclick="quitGame()">✕ Quit</button>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div id="stage"></div>
</div>

<script src="curriculum-data.js"></script>
<script src="js/class2_games.js"></script>
<script>
window.GAME_CONTENT = window.GAME_CONTENT || {};
const stage = document.getElementById('stage');
const params = new URLSearchParams(location.search);
let points = 0, act = null, content = null, finished = false;

// Leave the activity: inside the portal this tells the portal to return to the selection;
// opened on its own, it goes to the portal page.
function goBack(){
  if (window.parent !== window){ try { window.parent.postMessage({ type: 'mcb-quit' }, location.origin); return; } catch (e) {} }
  location.href = 'index.html';
}
function quitGame(){
  if (!finished && !confirm('Quit this activity? Your progress will be lost.')) return;
  goBack();
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function shuffleDiff(a){ if (a.length < 2) return a.slice(); let s; let n = 0; do { s = shuffle(a); n++; } while (s.every((v,i)=>v===a[i]) && n < 20); return s; }
function setBar(done,total){ document.getElementById('bar').style.width = (total ? Math.round(done/total*100) : 0) + '%'; }
function addPoints(n){ points += n; document.getElementById('pts').textContent = points; }
function norm(s){ return String(s).toLowerCase().replace(/[₹,]/g,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!]+$/,'').trim(); }
function sameAnswer(a,b){ const x = norm(a), y = norm(b); if (x === y) return true; const nx = Number(x), ny = Number(y); return x !== '' && y !== '' && !isNaN(nx) && !isNaN(ny) && nx === ny; }

let ac;
function tone(f,d,t,v,delay){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t||'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination); const n = ac.currentTime + (delay||0); g.gain.setValueAtTime(v||.25,n); g.gain.exponentialRampToValueAtTime(.001,n+d); o.start(n); o.stop(n+d); }catch(e){} }
const sfx = { ok(){ tone(660,.12); tone(880,.18,'sine',.25,.12); }, bad(){ tone(220,.3,'sawtooth',.18); }, win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'sine',.25,i*.14)); } };

function showMessage(h, lines){ stage.innerHTML = ''; const m = el('div','msg'); m.append(el('h2','',h)); lines.forEach(l => m.append(el('p','',l))); stage.append(m); }

function finish(score,total){
  setBar(1,1); stage.innerHTML = '';
  const ratio = total ? score/total : 0;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
  const r = el('div','res');
  r.append(el('div','stars','⭐'.repeat(stars) + '☆'.repeat(3-stars)));
  r.append(el('div','big', score + ' / ' + total));
  r.append(el('p','', ratio >= .9 ? 'Excellent work!' : ratio >= .6 ? 'Good job! Keep practising.' : 'Nice try! Play again to improve.'));
  finished = true;
  const saveBox = el('div','fb'); r.append(saveBox);
  const actions = el('div','row'); actions.style.justifyContent = 'center';
  if (!aid){
    const again = el('button','primary','↻ Play Again'); again.onclick = () => { finished = false; points = 0; addPoints(0); start(); };
    actions.append(again);
  }
  const back = el('button', aid ? 'primary' : 'ghost', '← Back to Activities'); back.onclick = goBack;
  actions.append(back);
  r.append(actions);
  stage.append(r); if (ratio >= .6) sfx.win();
  saveToServer(score, total, saveBox);
  const result = { type:'mcb-result', id: act.id, class: act.class, subject: act.subject, activity: act.name, gameType: act.type, score, total, student: params.get('student')||'', roll: params.get('roll')||'', date: new Date().toISOString() };
  try { const all = JSON.parse(localStorage.getItem('mcb_results')||'[]'); all.push(result); localStorage.setItem('mcb_results', JSON.stringify(all)); } catch(e){}
  try { window.parent !== window && window.parent.postMessage(result,'*'); } catch(e){}
}

function intro(text){ if (text) stage.append(el('div','intro',text)); }

/* ---------- Save the score on the server (same API the other games use) ---------- */
const API_ROOT = (location.port === '5000' ? '' : 'http://127.0.0.1:5000') + '/api';
const aid = params.get('aid');
const hasStudent = !!(params.get('student') && params.get('roll'));

async function saveToServer(score, total, box){
  if (!aid && !hasStudent){ box.className = 'fb'; box.textContent = 'Score not recorded (no student is attached to this task).'; return; }
  const responses = Array.from({length: total}, (_, i) => ({ question_id: i + 1, user_answer: i < Math.round(score) ? 'correct' : 'wrong', correct_answer: 'correct' }));
  const payload = aid ? { assignment_id: Number(aid), responses }
    : { student: params.get('student'), roll: params.get('roll'), class: act.class, subject: act.subject, skill: act.skill + ' – ' + act.subSkill, game: act.name, file: 'play.html', responses };
  const send = async () => {
    box.className = 'fb'; box.textContent = 'Saving score…';
    try {
      const res = await fetch(API_ROOT + '/scoring/submit-by-name', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const body = await res.json();
      if (res.ok && body.status === 'success'){ const d = body.score_data; box.className = 'fb ok'; box.textContent = 'Completed. Score saved: ' + d.score + '/' + d.max_score + ' points (' + Math.round(d.percentage) + '%).'; }
      else if (res.status === 409){ box.className = 'fb no'; box.textContent = 'This assignment was already completed earlier, so this attempt was not counted.'; }
      else { box.className = 'fb no'; box.textContent = 'The score was NOT saved: ' + (body.message || res.status); retry(); }
    } catch (e){ box.className = 'fb no'; box.textContent = 'The score was NOT saved: server not reachable (start it with python app.py).'; retry(); }
  };
  const retry = () => { const b = el('button','ghost','Retry saving'); b.onclick = send; box.append(document.createElement('br'), b); };
  send();
}

async function guardCompleted(){
  if (!aid) return;
  try {
    const res = await fetch(API_ROOT + '/portal/assignments/' + encodeURIComponent(aid), { cache: 'no-store' });
    if (res.status === 404) return;
    const a = (await res.json()).assignment;
    if (a && a.status === 'completed'){ alert('This game is already completed (' + a.score + '/' + a.max_score + ' points).'); location.replace('index.html'); }
  } catch (e) { /* server offline: the save step reports it */ }
}

/* ---------- MCQ / Odd One Out / Timed Challenge ---------- */
function runMCQ(items, timedSeconds){
  let i = 0, score = 0, locked = false, left = timedSeconds || 0, tm = null, over = false;
  const timerEl = el('span','timer');
  function end(){ if (over) return; over = true; clearInterval(tm); finish(score, items.length); }
  if (timedSeconds){ timerEl.textContent = '⏱ ' + left + 's'; tm = setInterval(() => { left--; timerEl.textContent = '⏱ ' + left + 's'; if (left <= 0) end(); }, 1000); }
  function show(){
    stage.innerHTML = ''; setBar(i, items.length); intro(i === 0 && content.intro);
    if (timedSeconds) stage.append(timerEl);
    const it = items[i];
    stage.append(el('div','qtext', (i+1) + '. ' + it.q));
    const box = el('div','options');
    shuffle(it.options.map((t,idx)=>({t,idx}))).forEach(o => {
      const b = el('button','opt',o.t); b.dataset.idx = o.idx;
      b.onclick = () => {
        if (locked || over) return; locked = true;
        if (o.idx === it.answer){ b.classList.add('right'); score++; addPoints(10); sfx.ok(); }
        else { b.classList.add('wrong'); [...box.children].find(c => +c.dataset.idx === it.answer).classList.add('right'); sfx.bad(); }
        if (it.explain) stage.append(el('div','explain',it.explain));
        const last = i + 1 >= items.length;
        const go = () => { if (over) return; i++; locked = false; i < items.length ? show() : end(); };
        if (timedSeconds){ setTimeout(go, 700); }
        else { const n = el('button','primary', last ? 'See result' : 'Next →'); n.onclick = go; stage.append(n); }
      };
      box.append(b);
    });
    stage.append(box);
  }
  show();
}

/* ---------- Typing Answer ---------- */
function runTyping(items){
  let i = 0, score = 0;
  function show(){
    stage.innerHTML = ''; setBar(i, items.length); intro(i === 0 && content.intro);
    const it = items[i];
    stage.append(el('div','qtext',(i+1)+'. '+it.q));
    const inp = el('input'); inp.type = 'text'; inp.placeholder = 'Type your answer…'; inp.autocomplete = 'off'; stage.append(inp);
    const fb = el('div','fb'); stage.append(fb);
    const btn = el('button','primary','Check'); stage.append(btn); inp.focus();
    let checked = false;
    function check(){
      if (checked){ i++; i < items.length ? show() : finish(score, items.length); return; }
      if (!inp.value.trim()) return;
      checked = true; inp.disabled = true;
      const ok = [it.answer].concat(it.accept||[]).some(a => sameAnswer(inp.value, a));
      if (ok){ score++; addPoints(10); sfx.ok(); fb.className = 'fb ok'; fb.textContent = '✅ Correct!'; }
      else { sfx.bad(); fb.className = 'fb no'; fb.textContent = '❌ The answer is: ' + it.answer; }
      if (it.explain) stage.append(el('div','explain',it.explain));
      btn.textContent = i + 1 < items.length ? 'Next →' : 'See result';
    }
    btn.onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  }
  show();
}

/* ---------- Fill in the Blank ---------- */
function runFill(items){
  let i = 0, score = 0;
  function show(){
    stage.innerHTML = ''; setBar(i, items.length); intro(i === 0 && content.intro);
    const it = items[i]; let locked = false;
    stage.append(el('div','qtext',(i+1)+'. '+it.text));
    const fb = el('div','fb');
    const next = () => { i++; i < items.length ? show() : finish(score, items.length); };
    function judge(ok){
      locked = true;
      if (ok){ score++; addPoints(10); sfx.ok(); fb.className = 'fb ok'; fb.textContent = '✅ Correct!'; }
      else { sfx.bad(); fb.className = 'fb no'; fb.textContent = '❌ The answer is: ' + it.answer; }
      if (it.explain) stage.append(el('div','explain',it.explain));
      const n = el('button','primary', i+1 < items.length ? 'Next →' : 'See result'); n.onclick = next; stage.append(n);
    }
    if (it.options && it.options.length){
      const row = el('div','row');
      shuffle(it.options).forEach(o => { const c = el('button','chip',o); c.onclick = () => { if (locked) return; c.classList.add(sameAnswer(o,it.answer) ? 'done' : 'bad'); judge(sameAnswer(o,it.answer)); }; row.append(c); });
      stage.append(row, fb);
    } else {
      const inp = el('input'); inp.type = 'text'; inp.placeholder = 'Type the missing word…'; stage.append(inp, fb);
      const b = el('button','primary','Check'); b.onclick = () => { if (locked || !inp.value.trim()) return; inp.disabled = true; judge([it.answer].concat(it.accept||[]).some(a => sameAnswer(inp.value,a))); b.remove(); }; stage.append(b);
    }
  }
  show();
}

/* ---------- Sequence Order ---------- */
function runSequence(rounds){
  let r = 0, score = 0, total = rounds.reduce((s,x)=>s+x.steps.length,0);
  function show(){
    stage.innerHTML = ''; setBar(r, rounds.length); intro(r === 0 && content.intro);
    const R = rounds[r], n = R.steps.length;
    stage.append(el('div','qtext', R.prompt || 'Put these in the correct order.'));
    const slots = el('div','slots'), pool = el('div','row'), picked = [];
    const slotEls = R.steps.map((_,k) => { const s = el('div','slot'); s.append(el('b','',k+1)); const t = el('span'); s.append(t); slots.append(s); return s; });
    const chips = shuffleDiff(R.steps).map(t => { const c = el('button','chip',t); c.onclick = () => { if (checked) return; picked.push({t,c}); c.classList.add('used'); redraw(); }; pool.append(c); return c; });
    let checked = false;
    function redraw(){ slotEls.forEach((s,k) => { const p = picked[k]; s.querySelector('span').textContent = p ? p.t : ''; s.className = 'slot'; }); checkBtn.disabled = picked.length !== n || checked; undo.disabled = !picked.length || checked; }
    const undo = el('button','ghost','↩ Undo'); undo.onclick = () => { const p = picked.pop(); if (p) p.c.classList.remove('used'); redraw(); };
    const checkBtn = el('button','primary','Check order');
    const fb = el('div','fb');
    checkBtn.onclick = () => {
      checked = true; let good = 0;
      slotEls.forEach((s,k) => { const ok = picked[k].t === R.steps[k]; s.classList.add(ok ? 'ok' : 'no'); if (ok) good++; });
      score += good; addPoints(good * 5);
      if (good === n){ sfx.ok(); fb.className = 'fb ok'; fb.textContent = '✅ Perfect order!'; }
      else { sfx.bad(); fb.className = 'fb no'; fb.textContent = '❌ ' + good + ' of ' + n + ' in the right place. Correct order: ' + R.steps.join(' → '); }
      const nx = el('button','primary', r+1 < rounds.length ? 'Next →' : 'See result'); nx.onclick = () => { r++; r < rounds.length ? show() : finish(score,total); };
      stage.append(nx);
    };
    stage.append(slots, el('div','','Tap the steps in order:'), pool, undo, checkBtn, fb); redraw();
  }
  show();
}

/* ---------- Match Pairs ---------- */
function runMatch(pairs){
  stage.innerHTML = ''; intro(content.intro);
  let matched = 0, mistakes = 0, selL = null, selR = null;
  const cols = el('div','cols'), L = el('div'), R = el('div');
  L.append(el('h3','','Match this…')); R.append(el('h3','','…with this'));
  const left = shuffle(pairs.map((p,i)=>({t:p[0],i}))), right = shuffle(pairs.map((p,i)=>({t:p[1],i})));
  const mk = (o, side) => { const c = el('button','chip',o.t); c.dataset.i = o.i; c.onclick = () => {
      if (c.classList.contains('done')) return;
      if (side === 'L'){ if (selL) selL.classList.remove('sel'); selL = c; c.classList.add('sel'); } else { if (selR) selR.classList.remove('sel'); selR = c; c.classList.add('sel'); }
      if (selL && selR){
        if (selL.dataset.i === selR.dataset.i){ selL.className = 'chip done'; selR.className = 'chip done'; matched++; addPoints(10); sfx.ok(); setBar(matched, pairs.length); selL = selR = null; if (matched === pairs.length) setTimeout(() => finish(Math.max(0, pairs.length - mistakes), pairs.length), 500); }
        else { mistakes++; sfx.bad(); const a = selL, b = selR; a.classList.add('bad'); b.classList.add('bad'); selL = selR = null; setTimeout(() => { a.classList.remove('bad','sel'); b.classList.remove('bad','sel'); }, 400); }
      } }; return c; };
  left.forEach(o => L.append(mk(o,'L'))); right.forEach(o => R.append(mk(o,'R')));
  cols.append(L,R); stage.append(cols); setBar(0,pairs.length);
}

/* ---------- Memory Match ---------- */
function runMemory(pairs){
  stage.innerHTML = ''; intro(content.intro);
  const cards = shuffle(pairs.flatMap((p,i) => [{t:p[0],i},{t:p[1],i}]));
  let first = null, lock = false, matched = 0, moves = 0;
  const g = el('div','grid');
  cards.forEach(cd => { const b = el('button','mem','?'); b.onclick = () => {
      if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
      b.classList.add('open'); b.textContent = cd.t;
      if (!first){ first = {b,cd}; return; }
      moves++; const a = first; first = null;
      if (a.cd.i === cd.i && a.b !== b){ a.b.className = 'mem done'; b.className = 'mem done'; matched++; addPoints(10); sfx.ok(); setBar(matched,pairs.length); if (matched === pairs.length) setTimeout(() => finish(pairs.length, pairs.length), 500); }
      else { lock = true; sfx.bad(); setTimeout(() => { a.b.className = 'mem'; a.b.textContent = '?'; b.className = 'mem'; b.textContent = '?'; lock = false; }, 800); }
    }; g.append(b); });
  stage.append(g); setBar(0,pairs.length);
}

/* ---------- Word Scramble ---------- */
function runScramble(items){
  let i = 0, score = 0;
  function show(){
    stage.innerHTML = ''; setBar(i, items.length); intro(i === 0 && content.intro);
    const it = items[i], sentence = /\s/.test(it.answer.trim());
    const target = sentence ? it.answer.trim().split(/\s+/) : it.answer.trim().split('');
    stage.append(el('div','qtext', (sentence ? 'Arrange the words to make a sentence' : 'Unscramble the letters') + (it.hint ? ' — Hint: ' + it.hint : '')));
    const built = el('div','word'), pool = el('div','row'), fb = el('div','fb'); let picked = [], tries = 0, done = false;
    const redraw = () => { built.textContent = picked.map(p => p.t).join(sentence ? ' ' : '') || '…'; chk.disabled = picked.length !== target.length || done; };
    shuffleDiff(target).forEach(t => { const c = el('button','chip',t); c.onclick = () => { if (done) return; picked.push({t,c}); c.classList.add('used'); redraw(); }; pool.append(c); });
    const undo = el('button','ghost','↩ Undo'); undo.onclick = () => { if (done) return; const p = picked.pop(); if (p) p.c.classList.remove('used'); redraw(); };
    const chk = el('button','primary','Check');
    const next = () => { i++; i < items.length ? show() : finish(score, items.length); };
    chk.onclick = () => {
      tries++; const ok = picked.map(p => p.t).join('|') === target.join('|');
      if (ok){ done = true; score++; addPoints(10); sfx.ok(); fb.className = 'fb ok'; fb.textContent = '✅ Correct!'; }
      else if (tries >= 3){ done = true; sfx.bad(); fb.className = 'fb no'; fb.textContent = '❌ The answer is: ' + it.answer; }
      else { sfx.bad(); fb.className = 'fb no'; fb.textContent = '❌ Not yet — try again (' + (3-tries) + ' left)'; picked.forEach(p => p.c.classList.remove('used')); picked = []; }
      redraw();
      if (done){ const n = el('button','primary', i+1 < items.length ? 'Next →' : 'See result'); n.onclick = next; stage.append(n); }
    };
    stage.append(built, pool, undo, chk, fb); redraw();
  }
  show();
}

/* ---------- Guess the Word ---------- */
function runGuess(items){
  let i = 0, score = 0;
  function show(){
    stage.innerHTML = ''; setBar(i, items.length); intro(i === 0 && content.intro);
    const it = items[i], ans = it.answer.toUpperCase(); let lives = 6; const got = new Set();
    stage.append(el('div','qtext','Hint: ' + (it.hint || '')));
    const wordEl = el('div','word'), info = el('div','fb'), keys = el('div','keys');
    const draw = () => { wordEl.textContent = ans.split('').map(ch => /[A-Z0-9]/.test(ch) ? (got.has(ch) ? ch : '_') : ch).join(' '); info.textContent = '❤️'.repeat(lives); };
    const won = () => ans.split('').every(ch => !/[A-Z0-9]/.test(ch) || got.has(ch));
    const next = () => { i++; i < items.length ? show() : finish(score, items.length); };
    const end = ok => { keys.querySelectorAll('button').forEach(b => b.disabled = true); if (ok){ score++; addPoints(10); sfx.ok(); info.className = 'fb ok'; info.textContent = '✅ You got it!'; } else { sfx.bad(); got.clear(); ans.split('').forEach(c => got.add(c)); draw(); info.className = 'fb no'; info.textContent = '❌ The word was ' + it.answer; }
      const n = el('button','primary', i+1 < items.length ? 'Next →' : 'See result'); n.onclick = next; stage.append(n); };
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch => { const k = el('button','key',ch); k.onclick = () => { k.disabled = true; if (ans.includes(ch)){ got.add(ch); k.classList.add('hit'); draw(); if (won()) end(true); } else { k.classList.add('miss'); lives--; draw(); if (lives <= 0) end(false); } }; keys.append(k); });
    stage.append(wordEl, info, keys); draw();
  }
  show();
}

/* ---------- Sort & Group ---------- */
function runSort(c){
  stage.innerHTML = ''; intro(content.intro);
  if (c.prompt) stage.append(el('div','qtext',c.prompt));
  const total = c.items.length; let placed = 0, mistakes = 0, sel = null;
  const pool = el('div','row'), cats = el('div','cats'), fb = el('div','fb');
  shuffle(c.items).forEach(it => { const b = el('button','chip',it.label); b.onclick = () => { if (b.classList.contains('done')) return; if (sel) sel.b.classList.remove('sel'); sel = {it,b}; b.classList.add('sel'); }; pool.append(b); });
  c.categories.forEach((name,k) => { const box = el('div','cat'); box.append(el('h4','',name)); box.onclick = () => {
      if (!sel) { fb.className = 'fb no'; fb.textContent = 'Pick an item first, then tap its group.'; return; }
      if (sel.it.category === k){ const chip = el('span','chip done',sel.it.label); box.append(chip); sel.b.remove(); sel = null; placed++; addPoints(10); sfx.ok(); fb.textContent = ''; setBar(placed,total); if (placed === total) setTimeout(() => finish(Math.max(0, total - mistakes), total), 500); }
      else { mistakes++; sfx.bad(); sel.b.classList.add('bad'); const b = sel.b; setTimeout(() => b.classList.remove('bad'), 400); fb.className = 'fb no'; fb.textContent = '❌ Not that group — try another.'; }
    }; cats.append(box); });
  stage.append(el('div','','Tap an item, then tap the group it belongs to:'), pool, cats, fb); setBar(0,total);
}

/* ---------- Story Builder ---------- */
function runStory(c){
  let i = 0; const chosen = [];
  function show(){
    stage.innerHTML = ''; setBar(i, c.parts.length); intro(i === 0 && (content.intro || c.prompt));
    if (i >= c.parts.length){
      const s = el('div','story', chosen.join(' ')); stage.append(el('div','qtext','Your story'), s);
      addPoints(10); sfx.win();
      const d = el('button','primary','Finish ✔'); d.onclick = () => finish(c.parts.length, c.parts.length);
      const again = el('button','ghost','Build another'); again.onclick = () => { i = 0; chosen.length = 0; show(); };
      stage.append(again, d); return;
    }
    const p = c.parts[i];
    stage.append(el('div','qtext', p.label));
    const box = el('div','options');
    p.choices.forEach(ch => { const b = el('button','opt',ch); b.onclick = () => { sfx.ok(); chosen.push(ch); i++; show(); }; box.append(b); });
    stage.append(box);
  }
  show();
}

/* ---------- Dispatcher ---------- */
function toMCQItems(c){
  if (c.questions) return c.questions;
  if (c.rounds) return c.rounds.map(r => ({ q: r.q || 'Which one is the odd one out?', options: r.items, answer: r.odd, explain: r.reason }));
  return [];
}
function start(){
  setBar(0,1); document.getElementById('pts').textContent = points;
  if (window.Class2Games && window.Class2Games.isClass2Interactive(act)) {
    return window.Class2Games.render(stage, act, (result) => {
      finish(result.score, result.total);
    });
  }
  const c = content, t = act.type;
  try {
    if (t === 'MCQ Quiz') return runMCQ(toMCQItems(c));
    if (t === 'Odd One Out') return runMCQ(toMCQItems(c));
    if (t === 'Timed Challenge') return runMCQ(toMCQItems(c), c.seconds || 60);
    if (t === 'Typing Answer') return runTyping(c.items);
    if (t === 'Fill in the Blank') return runFill(c.items);
    if (t === 'Sequence Order') return runSequence(c.rounds || [{ prompt: c.prompt, steps: c.steps }]);
    if (t === 'Match Pairs') return runMatch(c.pairs);
    if (t === 'Memory Match') return runMemory(c.pairs);
    if (t === 'Word Scramble') return runScramble(c.items);
    if (t === 'Guess the Word') return runGuess(c.items);
    if (t === 'Sort & Group') return runSort(c);
    if (t === 'Story Builder') return runStory(c);
    showMessage('Unknown game type', ['"' + t + '" is not supported yet.']);
  } catch (e) {
    showMessage('This activity could not start', ['Its content is incomplete for the "' + t + '" format.', String(e.message)]);
  }
}

function load(){
  let id = params.get('id');
  act = id ? getActivity(id) : null;
  const nm = params.get('activity') || params.get('game');
  if (!act && nm){
    act = ACTIVITIES.find(a => a.name === nm && (!params.get('class') || a.class === params.get('class')));
  }
  if (!act){ document.getElementById('title').textContent = 'Activity not found'; showMessage('Activity not found', ['Open this game from the Teacher / Student portal.']); return; }
  document.title = act.name + ' – MyClassboard Games';
  document.getElementById('title').textContent = act.name;
  document.getElementById('crumbs').textContent = 'Class ' + act.class + ' · ' + act.subject + ' · ' + act.skill + ' – ' + act.subSkill;
  document.getElementById('typeBadge').textContent = act.type;
  guardCompleted();
  const s = document.createElement('script');
  s.src = 'content/class-' + act.class + '.js';
  s.onload = () => { content = GAME_CONTENT[act.id]; content ? start() : showMessage('Content coming soon', ['This activity is in the curriculum but its questions have not been added yet.', 'ID: ' + act.id]); };
  s.onerror = () => showMessage('Content coming soon', ['No content file for Class ' + act.class + ' yet.', 'ID: ' + act.id]);
  document.head.appendChild(s);
}
load();
</script>
