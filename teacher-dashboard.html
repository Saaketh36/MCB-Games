<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Generate Exam PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f7fc; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #1f4f94; font-size: 32px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e5e7eb; }
        .tab-btn { padding: 12px 24px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #1f4f94; border-bottom-color: #1f4f94; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        label { display: block; font-weight: 600; color: #333; font-size: 14px; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: 'Poppins', sans-serif; }
        input:focus, select:focus { outline: none; border-color: #1f4f94; }
        select:disabled { background: #f5f5f5; color: #999; }

        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #1f4f94; color: white; width: 100%; }
        .btn-primary:hover { background: #173d76; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

        .pin-display { background: #fff3cd; border: 2px solid #ffc107; border-radius: 12px; padding: 24px; margin-top: 30px; text-align: center; display: none; }
        .pin-display.show { display: block; }
        .pin-label { font-size: 12px; color: #856404; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; }
        .pin-code { font-size: 48px; font-weight: 700; color: #ff6b35; letter-spacing: 6px; font-family: 'Courier New', monospace; margin-bottom: 16px; }
        .pin-instructions { color: #856404; font-size: 14px; margin-bottom: 16px; }
        .copy-btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .copy-btn:hover { background: #0056b3; }

        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .exam-info { background: #f4f6ff; border-left: 4px solid #667eea; padding: 16px; border-radius: 8px; margin-top: 20px; }
        .info-label { font-size: 12px; color: #667eea; font-weight: 600; text-transform: uppercase; }
        .info-value { font-size: 14px; font-weight: 600; color: #333; margin-top: 4px; }

        .results-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .results-table thead { background: #f9fafb; }
        .results-table th { padding: 12px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #e5e7eb; font-size: 13px; }
        .results-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
        .score-badge { background: #d4edda; color: #155724; padding: 6px 10px; border-radius: 6px; font-weight: 600; }

        .empty { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👨‍🏫 Teacher Dashboard</h1>
        <p class="subtitle">Generate PIN for students to take exam</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generate')">🔑 Generate PIN</button>
        <button class="tab-btn" onclick="switchTab('reports')">📊 Student Results</button>
    </div>

    <!-- Tab 1: Generate PIN -->
    <div id="generate" class="tab-content active">
        <div class="panel">
            <h2 style="color: #333; margin-bottom: 24px;">Create Exam & Generate PIN</h2>

            <div id="messageBox"></div>

            <div class="form-grid">
                <div>
                    <label for="classSelect">Class *</label>
                    <select id="classSelect" onchange="onClassChange()">
                        <option value="">-- Select Class --</option>
                    </select>
                </div>

                <div>
                    <label for="subjectSelect">Subject *</label>
                    <select id="subjectSelect" onchange="onSubjectChange()" disabled>
                        <option value="">-- Select Subject --</option>
                    </select>
                </div>

                <div>
                    <label for="skillSelect">Skill Area *</label>
                    <select id="skillSelect" onchange="onSkillChange()" disabled>
                        <option value="">-- Select Skill --</option>
                    </select>
                </div>

                <div>
                    <label for="activitySelect">Exam Activity *</label>
                    <select id="activitySelect" disabled>
                        <option value="">-- Select Activity --</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" id="generateBtn" onclick="generateExamPin()" disabled>🔑 Generate PIN for This Exam</button>

            <div id="pinSection" class="pin-display">
                <div class="pin-label">✅ PIN Generated Successfully</div>
                <div class="pin-code" id="displayPin">------</div>
                <div class="pin-instructions">
                    Share this PIN with students. They will enter this PIN to take the exam.
                </div>
                <div id="examDetails" class="exam-info"></div>
                <button class="copy-btn" onclick="copyPin()">📋 Copy PIN</button>
            </div>
        </div>
    </div>

    <!-- Tab 2: Student Results -->
    <div id="reports" class="tab-content">
        <div class="panel">
            <h2 style="color: #333; margin-bottom: 20px;">📊 Student Exam Results</h2>
            <button class="btn btn-primary" style="width: 200px; margin-bottom: 20px;" onclick="loadReports()">🔄 Refresh Results</button>
            <div id="reportsContainer" class="empty">Click Refresh to see student results</div>
        </div>
    </div>
</div>

<script src="curriculum-data.js"></script>
<script>
const API = (location.port === '5000' ? '' : 'http://127.0.0.1:5000') + '/api';
let currentActivity = null;
let currentPin = null;

console.log('Script loaded. Checking CURRICULUM_DATA...');

// Initialize on page load
window.addEventListener('load', function() {
    console.log('Page loaded');
    console.log('CURRICULUM_DATA available:', typeof CURRICULUM_DATA !== 'undefined');
    console.log('ACTIVITIES available:', typeof ACTIVITIES !== 'undefined');

    if (typeof CURRICULUM_DATA !== 'undefined' && CURRICULUM_DATA) {
        const classes = Object.keys(CURRICULUM_DATA);
        console.log('Available classes:', classes);

        const classSelect = document.getElementById('classSelect');
        classes.forEach(cls => {
            const opt = document.createElement('option');
            opt.value = cls;
            opt.textContent = 'Class ' + cls;
            classSelect.appendChild(opt);
        });
    } else {
        console.error('CURRICULUM_DATA is not defined!');
        showMessage('❌ Error: Curriculum data not loaded. Please refresh the page.', 'error');
    }
});

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

function onClassChange() {
    const classVal = document.getElementById('classSelect').value;
    console.log('Class selected:', classVal);

    document.getElementById('subjectSelect').innerHTML = '<option value="">-- Select Subject --</option>';
    document.getElementById('subjectSelect').disabled = true;
    document.getElementById('skillSelect').innerHTML = '<option value="">-- Select Skill --</option>';
    document.getElementById('skillSelect').disabled = true;
    document.getElementById('activitySelect').innerHTML = '<option value="">-- Select Activity --</option>';
    document.getElementById('activitySelect').disabled = true;
    document.getElementById('generateBtn').disabled = true;

    if (!classVal || !CURRICULUM_DATA[classVal]) {
        console.log('No data for class:', classVal);
        return;
    }

    const subjects = Object.keys(CURRICULUM_DATA[classVal]);
    console.log('Subjects for class', classVal + ':', subjects);

    const subjectSelect = document.getElementById('subjectSelect');
    subjects.forEach(subject => {
        const opt = document.createElement('option');
        opt.value = subject;
        opt.textContent = subject;
        subjectSelect.appendChild(opt);
    });
    document.getElementById('subjectSelect').disabled = false;
}

function onSubjectChange() {
    const classVal = document.getElementById('classSelect').value;
    const subjectVal = document.getElementById('subjectSelect').value;
    console.log('Subject selected:', subjectVal);

    document.getElementById('skillSelect').innerHTML = '<option value="">-- Select Skill --</option>';
    document.getElementById('skillSelect').disabled = true;
    document.getElementById('activitySelect').innerHTML = '<option value="">-- Select Activity --</option>';
    document.getElementById('activitySelect').disabled = true;
    document.getElementById('generateBtn').disabled = true;

    if (!classVal || !subjectVal || !CURRICULUM_DATA[classVal] || !CURRICULUM_DATA[classVal][subjectVal]) {
        return;
    }

    const skills = Object.keys(CURRICULUM_DATA[classVal][subjectVal]);
    console.log('Skills for', subjectVal + ':', skills);

    const skillSelect = document.getElementById('skillSelect');
    skills.forEach(skill => {
        const opt = document.createElement('option');
        opt.value = skill;
        opt.textContent = skill;
        skillSelect.appendChild(opt);
    });
    document.getElementById('skillSelect').disabled = false;
}

function onSkillChange() {
    const classVal = document.getElementById('classSelect').value;
    const subjectVal = document.getElementById('subjectSelect').value;
    const skillVal = document.getElementById('skillSelect').value;
    console.log('Skill selected:', skillVal);

    document.getElementById('activitySelect').innerHTML = '<option value="">-- Select Activity --</option>';
    document.getElementById('activitySelect').disabled = true;
    document.getElementById('generateBtn').disabled = true;

    if (!classVal || !subjectVal || !skillVal || !CURRICULUM_DATA[classVal] || !CURRICULUM_DATA[classVal][subjectVal] || !CURRICULUM_DATA[classVal][subjectVal][skillVal]) {
        return;
    }

    const activities = CURRICULUM_DATA[classVal][subjectVal][skillVal];
    console.log('Activities for', skillVal + ':', activities);

    const activitySelect = document.getElementById('activitySelect');
    activities.forEach(activity => {
        const opt = document.createElement('option');
        opt.value = activity.id;
        opt.textContent = activity.name + ' (' + activity.type + ')';
        activitySelect.appendChild(opt);
    });
    document.getElementById('activitySelect').disabled = false;

    // Enable generate button
    document.getElementById('activitySelect').addEventListener('change', function() {
        document.getElementById('generateBtn').disabled = this.value === '';
    });
}

async function generateExamPin() {
    const activityId = document.getElementById('activitySelect').value;

    if (!activityId) {
        showMessage('❌ Please select an activity', 'error');
        return;
    }

    // Find the activity in ACTIVITIES array
    currentActivity = ACTIVITIES.find(a => a.id === activityId);
    if (!currentActivity) {
        showMessage('❌ Activity not found', 'error');
        return;
    }

    const pin = Math.random().toString().slice(2, 8);
    currentPin = pin;

    try {
        const res = await fetch(API + '/portal/generate-pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                game_id: currentActivity.id,
                game_name: currentActivity.name,
                game_type: currentActivity.type,
                game_class: currentActivity.class,
                game_subject: currentActivity.subject,
                game_skill: currentActivity.skill,
                game_subskill: currentActivity.subSkill,
                pin: pin
            })
        });

        if (res.ok) {
            displayPin(pin);
            showMessage('✅ PIN Generated Successfully! Share with students.', 'success');
        } else {
            showMessage('❌ Error generating PIN', 'error');
        }
    } catch (e) {
        showMessage('❌ Server error: ' + e.message, 'error');
    }
}

function displayPin(pin) {
    document.getElementById('displayPin').textContent = pin;

    const examDetails = `
        <div>
            <div class="info-label">📚 Exam Activity</div>
            <div class="info-value">${currentActivity.name}</div>
        </div>
        <div style="margin-top: 12px;">
            <div class="info-label">📝 Type</div>
            <div class="info-value">${currentActivity.type}</div>
        </div>
        <div style="margin-top: 12px;">
            <div class="info-label">📍 Details</div>
            <div class="info-value">Class ${currentActivity.class} • ${currentActivity.subject}</div>
        </div>
    `;

    document.getElementById('examDetails').innerHTML = examDetails;
    document.getElementById('pinSection').classList.add('show');
}

function copyPin() {
    if (currentPin) {
        navigator.clipboard.writeText(currentPin);
        alert('✅ PIN copied to clipboard: ' + currentPin);
    }
}

async function loadReports() {
    try {
        const res = await fetch(API + '/portal/get-student-scores');
        if (!res.ok) {
            document.getElementById('reportsContainer').innerHTML = '<div class="empty">No results yet</div>';
            return;
        }

        const data = await res.json();
        if (!data.scores || data.scores.length === 0) {
            document.getElementById('reportsContainer').innerHTML = '<div class="empty">No student exam results yet</div>';
            return;
        }

        let html = `
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Completed</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.scores.forEach(s => {
            const date = new Date(s.completed_at).toLocaleDateString();
            html += `
                <tr>
                    <td><strong>${s.student_name}</strong></td>
                    <td>Class ${s.student_roll}</td>
                    <td>${s.activity_name}</td>
                    <td><span class="score-badge">${s.score}/${s.max_score}</span></td>
                    <td>${s.percentage}%</td>
                    <td>${date}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('reportsContainer').innerHTML = html;
    } catch (e) {
        document.getElementById('reportsContainer').innerHTML = `<div class="empty">Error loading results</div>`;
    }
}

function showMessage(text, type) {
    const box = document.getElementById('messageBox');
    box.innerHTML = `<div class="message ${type}">${text}</div>`;
}
</script>
</body>
</html>
