<!DOCTYPE html>
<html lang="en">
<head>
<script>location.replace("index.html");</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - MyClassboard Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 40px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        a.portal-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        a.portal-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<script src="curriculum-data.js"></script>

<div class="container">
    <header>
        <h1>🏫 TEACHER PORTAL</h1>
        <p class="subtitle">Select and Play Learning Activities</p>
    </header>

    <!-- SIMPLIFIED 4-DROPDOWN SECTION -->
    <div class="section">
        <div class="section-title">📋 Select and Play Activity</div>

        <div class="grid">
            <div class="section">
                <label>Dropdown 1: Class</label>
                <select id="selectClass" onchange="updateSubjects()">
                    <option value="">-- Select Class --</option>
                    <option value="I">Class I</option>
                    <option value="II">Class II</option>
                    <option value="III">Class III</option>
                    <option value="IV">Class IV</option>
                    <option value="V">Class V</option>
                    <option value="VI">Class VI</option>
                    <option value="VII">Class VII</option>
                    <option value="VIII">Class VIII</option>
                </select>
            </div>

            <div class="section">
                <label>Dropdown 2: Subject</label>
                <select id="selectSubject" onchange="updateSkills()">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>

            <div class="section">
                <label>Dropdown 3: Skill Area + Sub-Skill Area</label>
                <select id="selectSkill" onchange="updateActivities()">
                    <option value="">-- Select Skill --</option>
                </select>
            </div>

            <div class="section">
                <label>Dropdown 4: Activity Name + Game Type</label>
                <select id="selectActivity" onchange="selectActivity()">
                    <option value="">-- Select Activity --</option>
                </select>
            </div>
        </div>

        <button onclick="playActivity()" style="margin-top: 30px; width: 100%; padding: 14px 40px; font-size: 16px;">▶ PLAY ACTIVITY</button>
    </div>
</div>

<script>
// ============================================================
// STATE VARIABLES
// ============================================================

let selectedClass = '';
let selectedSubject = '';
let selectedSkill = '';
let selectedActivity = null;

// ============================================================
// DROPDOWN 1: UPDATE SUBJECTS (Class Change)
// ============================================================

function updateSubjects() {
    selectedClass = document.getElementById('selectClass').value;
    selectedSubject = '';
    selectedSkill = '';
    selectedActivity = null;

    const subjectSelect = document.getElementById('selectSubject');
    subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';

    if (selectedClass && CURRICULUM_DATA[selectedClass]) {
        Object.keys(CURRICULUM_DATA[selectedClass]).forEach(subject => {
            const option = document.createElement('option');
            option.value = subject;
            option.textContent = subject;
            subjectSelect.appendChild(option);
        });
        subjectSelect.disabled = false;
    } else {
        subjectSelect.disabled = true;
    }

    // Reset dependent dropdowns
    document.getElementById('selectSkill').innerHTML = '<option value="">-- Select Skill --</option>';
    document.getElementById('selectSkill').disabled = true;
    document.getElementById('selectActivity').innerHTML = '<option value="">-- Select Activity --</option>';
    document.getElementById('selectActivity').disabled = true;
}

// ============================================================
// DROPDOWN 2: UPDATE SKILLS (Subject Change)
// ============================================================

function updateSkills() {
    selectedSubject = document.getElementById('selectSubject').value;
    selectedSkill = '';
    selectedActivity = null;

    const skillSelect = document.getElementById('selectSkill');
    skillSelect.innerHTML = '<option value="">-- Select Skill --</option>';

    if (selectedClass && selectedSubject && CURRICULUM_DATA[selectedClass][selectedSubject]) {
        Object.keys(CURRICULUM_DATA[selectedClass][selectedSubject]).forEach(skill => {
            const option = document.createElement('option');
            option.value = skill;
            option.textContent = skill;
            skillSelect.appendChild(option);
        });
        skillSelect.disabled = false;
    } else {
        skillSelect.disabled = true;
    }

    // Reset activity dropdown
    document.getElementById('selectActivity').innerHTML = '<option value="">-- Select Activity --</option>';
    document.getElementById('selectActivity').disabled = true;
}

// ============================================================
// DROPDOWN 3: UPDATE ACTIVITIES (Skill Change)
// ============================================================

function updateActivities() {
    selectedSkill = document.getElementById('selectSkill').value;
    selectedActivity = null;

    const activitySelect = document.getElementById('selectActivity');
    activitySelect.innerHTML = '<option value="">-- Select Activity --</option>';

    if (selectedClass && selectedSubject && selectedSkill &&
        CURRICULUM_DATA[selectedClass][selectedSubject][selectedSkill]) {

        const activities = CURRICULUM_DATA[selectedClass][selectedSubject][selectedSkill];

        activities.forEach((activity, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${activity.name} – ${activity.type}`;
            option.dataset.activity = JSON.stringify(activity);
            activitySelect.appendChild(option);
        });

        activitySelect.disabled = false;
    } else {
        activitySelect.disabled = true;
    }
}

// ============================================================
// DROPDOWN 4: STORE SELECTED ACTIVITY
// ============================================================

function selectActivity() {
    const activitySelect = document.getElementById('selectActivity');
    const index = activitySelect.value;

    if (index !== '') {
        const activities = CURRICULUM_DATA[selectedClass][selectedSubject][selectedSkill];
        selectedActivity = activities[index];
    } else {
        selectedActivity = null;
    }
}

// ============================================================
// PLAY ACTIVITY - DIRECT NAVIGATION
// ============================================================

function playActivity() {
    // Validate all selections
    if (!selectedClass) {
        alert('Please select a Class');
        return;
    }
    if (!selectedSubject) {
        alert('Please select a Subject');
        return;
    }
    if (!selectedSkill) {
        alert('Please select a Skill');
        return;
    }
    if (!selectedActivity) {
        alert('Please select an Activity');
        return;
    }

    // Build URL with all parameters
    const params = new URLSearchParams({
        class: selectedClass,
        subject: selectedSubject,
        skill: selectedSkill,
        activity: selectedActivity.name,
        type: selectedActivity.type,
        id: selectedActivity.id
    });

    const url = `${selectedActivity.file}?${params.toString()}`;
    window.open(url, '_blank');
}

// Attach event listener to activity dropdown
document.addEventListener('DOMContentLoaded', function() {
    const activitySelect = document.getElementById('selectActivity');
    if (activitySelect) {
        activitySelect.addEventListener('change', selectActivity);
    }
});
</script>

</body>
</html>
