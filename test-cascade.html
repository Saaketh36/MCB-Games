<!DOCTYPE html>
<html>
<head>
    <title>Test Cascading Dropdowns</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .test-box { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        select { padding: 8px; margin: 5px 0; width: 100%; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        .status { padding: 10px; background: #e3f2fd; border-radius: 4px; margin-top: 10px; font-size: 14px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<h1>🧪 Cascading Dropdowns Test</h1>

<div class="test-box">
    <h2>Step 1: Select Class</h2>
    <label>Class</label>
    <select id="classSelect" onchange="testClass()">
        <option value="">-- Select Class --</option>
        <option value="I">Class I</option>
        <option value="II">Class II</option>
    </select>
    <div class="status" id="classStatus">Waiting for selection...</div>
</div>

<div class="test-box">
    <h2>Step 2: Select Subject</h2>
    <label>Subject</label>
    <select id="subjectSelect" onchange="testSubject()" disabled>
        <option value="">-- Select Subject --</option>
    </select>
    <div class="status" id="subjectStatus">Select a class first</div>
</div>

<div class="test-box">
    <h2>Step 3: Select Skill</h2>
    <label>Skill Area</label>
    <select id="skillSelect" onchange="testSkill()" disabled>
        <option value="">-- Select Skill --</option>
    </select>
    <div class="status" id="skillStatus">Select a subject first</div>
</div>

<div class="test-box">
    <h2>Step 4: Select Activity</h2>
    <label>Activity + Game Type</label>
    <select id="activitySelect" disabled>
        <option value="">-- Select Activity --</option>
    </select>
    <div class="status" id="activityStatus">Select a skill first</div>
</div>

<script src="curriculum-data.js"></script>
<script>
function testClass() {
    const classVal = document.getElementById('classSelect').value;
    const status = document.getElementById('classStatus');

    if (!classVal) {
        status.innerHTML = '❌ No class selected';
        document.getElementById('subjectSelect').disabled = true;
        return;
    }

    if (!CURRICULUM_DATA[classVal]) {
        status.innerHTML = `<span class="error">❌ Class ${classVal} not found in CURRICULUM_DATA</span>`;
        return;
    }

    const subjects = Object.keys(CURRICULUM_DATA[classVal]);
    status.innerHTML = `<span class="success">✅ Class ${classVal} found with ${subjects.length} subjects</span>`;

    // Populate subjects
    const subjectSelect = document.getElementById('subjectSelect');
    subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';
    subjects.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        subjectSelect.appendChild(opt);
    });
    subjectSelect.disabled = false;
}

function testSubject() {
    const classVal = document.getElementById('classSelect').value;
    const subjectVal = document.getElementById('subjectSelect').value;
    const status = document.getElementById('subjectStatus');

    if (!subjectVal) {
        status.innerHTML = '❌ No subject selected';
        document.getElementById('skillSelect').disabled = true;
        return;
    }

    if (!CURRICULUM_DATA[classVal] || !CURRICULUM_DATA[classVal][subjectVal]) {
        status.innerHTML = `<span class="error">❌ Subject ${subjectVal} not found</span>`;
        return;
    }

    const skills = Object.keys(CURRICULUM_DATA[classVal][subjectVal]);
    status.innerHTML = `<span class="success">✅ Subject ${subjectVal} found with ${skills.length} skills</span>`;

    // Populate skills
    const skillSelect = document.getElementById('skillSelect');
    skillSelect.innerHTML = '<option value="">-- Select Skill --</option>';
    skills.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        skillSelect.appendChild(opt);
    });
    skillSelect.disabled = false;
}

function testSkill() {
    const classVal = document.getElementById('classSelect').value;
    const subjectVal = document.getElementById('subjectSelect').value;
    const skillVal = document.getElementById('skillSelect').value;
    const status = document.getElementById('skillStatus');

    if (!skillVal) {
        status.innerHTML = '❌ No skill selected';
        document.getElementById('activitySelect').disabled = true;
        return;
    }

    if (!CURRICULUM_DATA[classVal] || !CURRICULUM_DATA[classVal][subjectVal] || !CURRICULUM_DATA[classVal][subjectVal][skillVal]) {
        status.innerHTML = `<span class="error">❌ Skill ${skillVal} not found</span>`;
        return;
    }

    const activities = CURRICULUM_DATA[classVal][subjectVal][skillVal];
    status.innerHTML = `<span class="success">✅ Skill found with ${activities.length} activities</span>`;

    // Populate activities
    const activitySelect = document.getElementById('activitySelect');
    activitySelect.innerHTML = '<option value="">-- Select Activity --</option>';
    activities.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name + ' – ' + a.type;
        activitySelect.appendChild(opt);
    });
    activitySelect.disabled = false;

    const activity = activities[0];
    document.getElementById('activityStatus').innerHTML = `<span class="success">✅ First activity: ${activity.name} (${activity.type})</span>`;
}

// Test on load
console.log('CURRICULUM_DATA keys:', Object.keys(CURRICULUM_DATA));
console.log('Class I subjects:', Object.keys(CURRICULUM_DATA.I || {}));
</script>

</body>
</html>
